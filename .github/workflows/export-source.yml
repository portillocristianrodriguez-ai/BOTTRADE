name: Export source bundle
on:
  push:
    branches:
      - app-v1
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create source bundle
        run: zip -r BOTTRADE-app-v1.zip . -x '.git/*'
      - name: Upload source bundle
        uses: actions/upload-artifact@v4
        with:
          name: BOTTRADE-app-v1-source
          path: BOTTRADE-app-v1.zip
          retention-days: 7
