name: Telegram startup summary

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-startup-message:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Summarize startup universes
        shell: python
        run: |
          from pathlib import Path
          p = Path("main.py")
          text = p.read_text(encoding="utf-8")
          old = '''            f"Acciones: "\n            f"{', '.join(config.TICKERS) or '(ninguna)'}\\n"'''
          new = '''            f"📈 Universo acciones: {len(config.TICKERS):,} acciones\\n"\n            f"₿ Universo crypto: {'ACTIVO' if config.CRYPTO_SCANNER_ENABLED else 'DESACTIVADO'} (completo)\\n"'''
          if old not in text:
              print("Startup message already summarized or pattern not found; no change.")
              raise SystemExit(0)
          p.write_text(text.replace(old, new, 1), encoding="utf-8")

      - name: Commit patch
        run: |
          if git diff --quiet -- main.py; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py
          git commit -m "fix: resumir universos en notificacion de inicio"
          git push origin main
